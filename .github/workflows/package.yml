name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-package:
    name: ${{ matrix.os }} Debian package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: package-ccache-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**') }}
          restore-keys: |
            package-ccache-${{ matrix.os }}-${{ github.ref_name }}-
            package-ccache-${{ matrix.os }}-

      - name: Check required scripts
        run: |
          ./scripts/check-scripts.sh

      - name: Check documentation
        run: |
          ./scripts/check-docs.sh

      - name: Check JSON files
        run: |
          ./scripts/check-json.sh

      - name: Validate enrollment manifest example
        run: |
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json

      - name: Validate model evaluation metrics example
        run: |
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json

      - name: Validate detector output example
        run: |
          scripts/validate-detector-output.py schemas/detector-output.example.json

      - name: Detector output generation test
        run: |
          ./scripts/test-detector-output-generation.sh

      - name: Install build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh core

      - name: Select and verify CPU models
        run: |
          ./scripts/download-cpu-models.sh

      - name: Build and test
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ./scripts/test.sh
          ./scripts/audit-dependencies.sh
          ccache --show-stats || true

      - name: Build Debian package
        run: |
          cmake --build build --target package
          ls -lh build/*.deb
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb | sed -n '1,160p'

      - name: Install package smoke test
        run: |
          sudo apt-get install -y ./build/*.deb
          face-unlockd --help
          test -f "$(./scripts/pam-module-path.sh)"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-deb-${{ matrix.os }}
          path: build/*.deb
