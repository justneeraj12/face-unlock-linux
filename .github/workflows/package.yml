name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2404-package:
    name: Ubuntu 24.04 Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: package-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**') }}
          restore-keys: |
            package-ccache-${{ runner.os }}-${{ github.ref_name }}-
            package-ccache-${{ runner.os }}-

      - name: Check required scripts
        run: |
          ./scripts/check-scripts.sh

      - name: Check documentation
        run: |
          ./scripts/check-docs.sh

      - name: Check JSON files
        run: |
          ./scripts/check-json.sh

      - name: Validate enrollment manifest example
        run: |
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json

      - name: Validate model evaluation metrics example
        run: |
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json

      - name: Validate detector output example
        run: |
          scripts/validate-detector-output.py schemas/detector-output.example.json

      - name: Install build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh core

      - name: Build and test
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ./scripts/test.sh
          ./scripts/audit-dependencies.sh
          ccache --show-stats || true

      - name: Build Debian package
        run: |
          cmake --build build --target package
          ls -lh build/*.deb
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb | head -160

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-deb-ubuntu-24.04
          path: build/*.deb
