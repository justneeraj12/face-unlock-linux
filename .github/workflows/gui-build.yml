name: gui-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "daemon/**"
      - "scripts/download-cpu-models.sh"
      - "scripts/test-model-selection.sh"
      - "CMakeLists.txt"
      - ".github/workflows/gui-build.yml"
  pull_request:
    paths:
      - "gui/**"
      - "daemon/**"
      - "scripts/download-cpu-models.sh"
      - "scripts/test-model-selection.sh"
      - "CMakeLists.txt"
      - ".github/workflows/gui-build.yml"

permissions:
  contents: read

jobs:
  platform-gui-build:
    name: ${{ matrix.os }} Qt GUI build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gui-ccache-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'gui/src/**', 'daemon/src/**', 'pam/**') }}
          restore-keys: |
            gui-ccache-${{ matrix.os }}-${{ github.ref_name }}-
            gui-ccache-${{ matrix.os }}-


      - name: Check documentation
        run: |
          ./scripts/check-docs.sh

      - name: Install GUI build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh gui

      - name: Select and verify CPU models
        run: |
          ./scripts/download-cpu-models.sh

      - name: Build GUI
        run: |
          ccache --zero-stats || true
          ./scripts/build-gui.sh
          ccache --show-stats || true

      - name: Verify GUI artifact
        run: |
          test -x build-gui/gui/face-unlock-enroll
          file build-gui/gui/face-unlock-enroll

      - name: Test enrollment response parser
        run: |
          ./build-gui/gui/face-unlock-enroll --self-test-enrollment-json

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-enroll-${{ matrix.os }}
          path: build-gui/gui/face-unlock-enroll
