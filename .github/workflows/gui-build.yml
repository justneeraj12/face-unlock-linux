name: gui-build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gui/**"
      - "CMakeLists.txt"
      - ".github/workflows/gui-build.yml"

permissions:
  contents: read

jobs:
  ubuntu-2404-gui-build:
    name: Ubuntu 24.04 Qt GUI build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: gui-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'gui/src/**', 'daemon/src/**', 'pam/**') }}
          restore-keys: |
            gui-ccache-${{ runner.os }}-${{ github.ref_name }}-
            gui-ccache-${{ runner.os }}-


      - name: Check documentation
        run: |
          ./scripts/check-docs.sh

      - name: Install GUI build dependencies
        timeout-minutes: 25
        run: |
          set -euxo pipefail

          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'APT_EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT_EOF

          sudo apt-get -o Acquire::Retries=5 update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            file \
            libopencv-core-dev \
            libopencv-videoio-dev \
            libpam0g-dev \
            libsodium-dev \
            qt6-base-dev

      - name: Configure GUI build
        run: |
          cmake_args=(-S . -B build-gui -DBUILD_GUI=ON)
          if command -v ninja >/dev/null 2>&1; then
            cmake_args+=(-G Ninja)
          fi
          if command -v ccache >/dev/null 2>&1; then
            cmake_args+=(
              -DCMAKE_C_COMPILER_LAUNCHER=ccache
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            )
          fi
          cmake "${cmake_args[@]}"

      - name: Build GUI
        run: |
          ccache --zero-stats || true
          cmake --build build-gui --parallel
          ccache --show-stats || true

      - name: Verify GUI artifact
        run: |
          test -x build-gui/gui/face-unlock-enroll
          file build-gui/gui/face-unlock-enroll

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-enroll-ubuntu-24.04
          path: build-gui/gui/face-unlock-enroll
