name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2404-build:
    name: Ubuntu 24.04 CMake build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**', 'gui/src/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-


      - name: Check required scripts
        run: |
          ./scripts/check-scripts.sh

      - name: Check documentation before apt install
        run: |
          ./scripts/check-docs.sh

      - name: Check JSON files
        run: |
          ./scripts/check-json.sh

      - name: Validate enrollment manifest example
        run: |
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json

      - name: Validate model evaluation metrics example
        run: |
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json

      - name: Install build dependencies
        timeout-minutes: 45
        run: |
          set -euxo pipefail

          echo "Current apt sources:"
          ls -la /etc/apt/sources.list.d || true
          cat /etc/apt/sources.list || true
          cat /etc/apt/sources.list.d/*.sources || true

          # GitHub Ubuntu runners may use azure mirrorlists that can be slow.
          # Replace the Ubuntu deb822 source with explicit archive/security URLs.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'APT_EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT_EOF

          sudo apt-get clean
          sudo apt-get -o Acquire::Retries=5 update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            file \
            libopencv-core-dev \
            libopencv-videoio-dev \
            libpam0g-dev \
            libsodium-dev

      - name: Show tool versions
        run: |
          cmake --version
          echo "Installed OpenCV packages:"
          dpkg -l | grep -E 'libopencv-(core|videoio).*dev' || true
          echo "OpenCV headers:"
          find /usr/include -path '*opencv2/core.hpp' -print || true
          echo "OpenCV libraries:"
          ldconfig -p | grep -E 'libopencv_(core|videoio)' || true

      - name: Configure and build
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ccache --show-stats || true

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Smoke test daemon CLI
        run: |
          ./build/daemon/face-unlockd --help
          ./build/daemon/face-unlockd --model-test || true

      - name: Verify build outputs
        run: |
          test -x ./build/daemon/face-unlockd
          test -x ./build/daemon/face-unlock-crypto-selftest
          test -f ./build/pam/pam_face_unlock.so
          file ./build/daemon/face-unlockd
          file ./build/daemon/face-unlock-crypto-selftest
          file ./build/pam/pam_face_unlock.so

      - name: Audit dependencies
        run: |
          ./scripts/audit-dependencies.sh

      - name: Build Debian package
        run: |
          cmake --build build --target package
          ls -lh build/*.deb
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb | head -120

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlockd-ubuntu-24.04
          path: build/daemon/face-unlockd

      - name: Upload PAM module artifact
        uses: actions/upload-artifact@v4
        with:
          name: pam-face-unlock-ubuntu-24.04
          path: build/pam/pam_face_unlock.so

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-deb-ubuntu-24.04
          path: build/*.deb
