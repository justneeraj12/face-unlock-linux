name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-2404-build:
    name: Ubuntu 24.04 CMake build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation before apt install
        run: |
          ./scripts/check-docs.sh

      - name: Install build dependencies
        timeout-minutes: 20
        run: |
          set -euxo pipefail

          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          sudo apt-get -o Acquire::Retries=5 update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            file \
            libopencv-core-dev \
            libopencv-videoio-dev \
            libpam0g-dev \
            libsodium-dev

      - name: Show tool versions
        run: |
          cmake --version
          echo "Installed OpenCV packages:"
          dpkg -l | grep -E 'libopencv-(core|videoio).*dev' || true
          echo "OpenCV headers:"
          find /usr/include -path '*opencv2/core.hpp' -print || true
          echo "OpenCV libraries:"
          ldconfig -p | grep -E 'libopencv_(core|videoio)' || true

      - name: Configure and build
        run: |
          ./scripts/build.sh

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Smoke test daemon CLI
        run: |
          ./build/daemon/face-unlockd --help
          ./build/daemon/face-unlockd --model-test || true

      - name: Verify build outputs
        run: |
          test -x ./build/daemon/face-unlockd
          test -x ./build/daemon/face-unlock-crypto-selftest
          test -f ./build/pam/pam_face_unlock.so
          file ./build/daemon/face-unlockd
          file ./build/daemon/face-unlock-crypto-selftest
          file ./build/pam/pam_face_unlock.so

      - name: Audit PAM module dependencies
        run: |
          ldd ./build/pam/pam_face_unlock.so

          if ldd ./build/pam/pam_face_unlock.so | grep -Ei 'opencv|torch|cuda|cudart|Qt|tensorflow|sodium'; then
            echo "ERROR: PAM module links to disallowed heavy dependency."
            exit 1
          fi

          echo "PAM dependency audit passed."

      - name: Build Debian package
        run: |
          cmake --build build --target package
          ls -lh build/*.deb
          dpkg-deb -I build/*.deb
          dpkg-deb -c build/*.deb | head -120

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlockd-ubuntu-24.04
          path: build/daemon/face-unlockd

      - name: Upload PAM module artifact
        uses: actions/upload-artifact@v4
        with:
          name: pam-face-unlock-ubuntu-24.04
          path: build/pam/pam_face_unlock.so

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-deb-ubuntu-24.04
          path: build/*.deb
