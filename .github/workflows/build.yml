name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-build:
    name: ${{ matrix.os }} CMake build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**', 'gui/src/**') }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ github.ref_name }}-
            ccache-${{ matrix.os }}-


      - name: Check required scripts
        run: |
          ./scripts/check-scripts.sh

      - name: Check documentation before apt install
        run: |
          ./scripts/check-docs.sh

      - name: Check JSON files
        run: |
          ./scripts/check-json.sh

      - name: Validate enrollment manifest example
        run: |
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json

      - name: Validate model evaluation metrics example
        run: |
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json

      - name: Validate detector output example
        run: |
          scripts/validate-detector-output.py schemas/detector-output.example.json

      - name: Python detector smoke test
        run: |
          ./scripts/test-python-detectors.sh

      - name: Detector output generation test
        run: |
          ./scripts/test-detector-output-generation.sh


      - name: Install build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh core

      - name: Select and verify CPU models
        run: |
          ./scripts/download-cpu-models.sh

      - name: Show tool versions
        run: |
          cmake --version
          echo "Installed OpenCV packages:"
          dpkg -l | grep -E 'libopencv-(core|dnn|objdetect|imgproc|videoio).*dev' || true
          echo "OpenCV headers:"
          find /usr/include -path '*opencv2/core.hpp' -print || true
          echo "OpenCV libraries:"
          ldconfig -p | grep -E 'libopencv_(core|dnn|objdetect|imgproc|videoio)' || true

      - name: Configure and build
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ccache --show-stats || true

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Smoke test daemon CLI
        run: |
          ./build/daemon/face-unlockd --help
          ./build/daemon/face-unlockd --model-test || true

      - name: Verify build outputs
        run: |
          test -x ./build/daemon/face-unlockd
          test -x ./build/daemon/face-unlock-crypto-selftest
          test -f ./build/pam/pam_face_unlock.so
          file ./build/daemon/face-unlockd
          file ./build/daemon/face-unlock-crypto-selftest
          file ./build/pam/pam_face_unlock.so

      - name: Audit dependencies
        run: |
          ./scripts/audit-dependencies.sh
