name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: ${{ matrix.os }} release package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: release-ccache-${{ matrix.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**', 'gui/src/**') }}
          restore-keys: |
            release-ccache-${{ matrix.os }}-${{ github.ref_name }}-
            release-ccache-${{ matrix.os }}-

      - name: Repository checks
        run: |
          ./scripts/check-scripts.sh
          ./scripts/check-docs.sh
          ./scripts/check-json.sh
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json
          scripts/validate-detector-output.py schemas/detector-output.example.json
          ./scripts/test-detector-output-generation.sh
          ./scripts/test-model-selection.sh

      - name: Install build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh core

      - name: Select and verify CPU models
        run: |
          ./scripts/download-cpu-models.sh

      - name: Build, test, and audit
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ./scripts/test.sh
          ./scripts/audit-dependencies.sh
          ccache --show-stats || true

      - name: Build release package
        run: |
          cmake --build build --target package
          mkdir -p artifacts
          package_file="$(find build -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package_file"
          cp "$package_file" "artifacts/face-unlock-linux_${GITHUB_REF_NAME}_${{ matrix.os }}_amd64.deb"
          dpkg-deb -I "$package_file"
          dpkg-deb -c "$package_file" | sed -n '1,160p'

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-release-${{ matrix.os }}
          path: artifacts/*.deb

  publish-release:
    name: Publish release packages
    needs: build-release
    runs-on: ubuntu-26.04

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: face-unlock-linux-release-*
          path: artifacts
          merge-multiple: true

      - name: Inspect release files
        run: |
          ls -lh artifacts/*.deb
          for package_file in artifacts/*.deb; do
            dpkg-deb -f "$package_file" Package Version Architecture Depends
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/*.deb
          generate_release_notes: true
