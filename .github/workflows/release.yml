name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ubuntu-2404-release:
    name: Ubuntu 24.04 release package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: release-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', 'daemon/src/**', 'pam/**', 'gui/src/**') }}
          restore-keys: |
            release-ccache-${{ runner.os }}-${{ github.ref_name }}-
            release-ccache-${{ runner.os }}-


      - name: Check required scripts
        run: |
          ./scripts/check-scripts.sh

      - name: Check documentation
        run: |
          ./scripts/check-docs.sh

      - name: Check JSON files
        run: |
          ./scripts/check-json.sh

      - name: Validate enrollment manifest example
        run: |
          scripts/validate-enrollment-manifest.py schemas/enrollment-manifest.example.json

      - name: Validate model evaluation metrics example
        run: |
          scripts/validate-model-eval-metrics.py schemas/model-eval-metrics.example.json

      - name: Install build dependencies
        timeout-minutes: 35
        run: |
          ./scripts/ci-install-deps.sh core

      - name: Configure and build
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh
          ccache --show-stats || true

      - name: Run tests
        run: |
          ./scripts/test.sh

      - name: Audit dependencies
        run: |
          ./scripts/audit-dependencies.sh

      - name: Build Debian package
        run: |
          cmake --build build --target package
          mkdir -p artifacts
          cp build/*.deb artifacts/
          ls -lh artifacts/

      - name: Inspect Debian package
        run: |
          dpkg-deb -I artifacts/*.deb
          dpkg-deb -c artifacts/*.deb | head -160

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-unlock-linux-release-deb
          path: artifacts/*.deb

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/*.deb
          generate_release_notes: true
