name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - daemon
        - PAM
        - GUI
        - packaging
        - documentation
        - models
        - security
        - other
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security/privacy considerations
      description: Could this affect authentication, privacy, or stored biometric data?
    validations:
      required: false
