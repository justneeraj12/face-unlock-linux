name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not attach face images, biometric templates, private logs, or secrets.

  - type: input
    id: version
    attributes:
      label: Project version or commit
      placeholder: "commit hash or version"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: Desktop/session
      placeholder: "GNOME Wayland, KDE X11, etc."
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove sensitive data before pasting.
      render: shell
    validations:
      required: false
