name: Hardware compatibility report
description: Share privacy-safe Ubuntu, CPU, camera, and latency results
title: "[Hardware]: "
labels: ["hardware", "testing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping build the compatibility matrix. Do not attach face images, camera frames, embeddings, encrypted templates, keys, or private logs.

  - type: input
    id: version
    attributes:
      label: face-unlock-linux version
      placeholder: "v0.2.0-beta.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and kernel
      placeholder: "Ubuntu 26.04.1, Linux 7.0.0"
    validations:
      required: true

  - type: input
    id: session
    attributes:
      label: Desktop session
      placeholder: "Hyprland 0.53.3 on Wayland"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "AMD Ryzen 7 7840U or Intel Core i5-12500H"
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Camera and driver
      placeholder: "Integrated USB UVC webcam; driver uvcvideo"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Test result
      options:
        - Build, GUI, models, and camera diagnostics passed
        - Build and GUI passed; camera unavailable
        - Build passed; GUI failed
        - Build failed
    validations:
      required: true

  - type: textarea
    id: timing
    attributes:
      label: Privacy-safe timing results
      description: Paste numeric output only from the documented benchmark commands.
      render: shell
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes and reproducible failures
      description: Remove usernames, paths, device serials, and biometric data.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach face images, frames, embeddings, templates, keys, or private logs.
          required: true
        - label: I understand this beta does not enable production face authentication.
          required: true
